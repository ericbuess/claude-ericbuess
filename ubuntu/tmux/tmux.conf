# Enhanced tmux configuration with session persistence
# This config includes automatic save/restore of sessions across restarts

# ============================================================================
# BASIC SETTINGS (from original config)
# ============================================================================

# Increase scrollback buffer (30k lines)
set -g history-limit 30000

# Enable mouse support for scrolling and pane selection
set -g mouse on

# Better color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Reduce escape time for faster key response
set -sg escape-time 10

# Enable focus events (useful for vim/neovim)
set -g focus-events on

# Status bar improvements
set -g status-style bg=colour235,fg=colour136
set -g status-left '#[fg=colour235,bg=colour252,bold] #S '
set -g status-right '#[fg=colour235,bg=colour252] %Y-%m-%d %H:%M | #{continuum_status}'

# Window status
setw -g window-status-format '#[fg=colour244] #I:#W '
setw -g window-status-current-format '#[fg=colour222,bold] #I:#W '

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51

# Copy mode settings
setw -g mode-keys vi

# Enable OSC 52 clipboard support
set -g set-clipboard on
set -as terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'
set -as terminal-overrides ',screen*:Ms=\E]52;%p1%s;%p2%s\007'

# Mouse selection with OSC 52 clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.tmux-osc52-clipboard.sh"

# Keyboard copy also uses OSC 52
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.tmux-osc52-clipboard.sh"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.tmux-osc52-clipboard.sh"

# Double/triple click selection
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe "~/.tmux-osc52-clipboard.sh"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe "~/.tmux-osc52-clipboard.sh"

# Middle click paste (if supported)
bind-key -n MouseDown2Pane run "tmux set-buffer \"$(xclip -o -sel clipboard 2>/dev/null || pbpaste 2>/dev/null)\"; tmux paste-buffer"

# Mouse bindings moved to bottom after TPM initialization

# Quick reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Better splitting shortcuts
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Maintain current path when creating new windows
bind c new-window -c "#{pane_current_path}"

# ============================================================================
# TMUX PLUGIN MANAGER (TPM)
# ============================================================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# DISABLED: These plugins interfere with mouse scrolling in Claude CLI
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# ============================================================================
# RESURRECT CONFIGURATION
# ============================================================================

# Key bindings for manual save/restore
set -g @resurrect-save 'S'      # Ctrl-b Shift-S to save
set -g @resurrect-restore 'R'   # Ctrl-b Shift-R to restore

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Restore specific programs (add more as needed)
# NOTE: claude removed - it interferes with mouse scrolling when restored
set -g @resurrect-processes 'ssh mosh nvim vim man less more tail top htop python node npm'

# Restore neovim sessions (requires vim-obsession plugin in nvim)
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'

# Save and restore tmux pane layouts
set -g @resurrect-save-shell-history 'on'

# ============================================================================
# CONTINUUM CONFIGURATION (Automatic Save/Restore)
# ============================================================================

# Automatic restore when tmux is started
# DISABLED: Interferes with mouse scrolling in restored sessions
set -g @continuum-restore 'off'

# Save session every 5 minutes (can be changed)
set -g @continuum-save-interval '5'

# Start tmux server on boot (systemd)
set -g @continuum-boot 'on'

# Optional: Show save status in status bar
set -g @continuum-status 'on'

# ============================================================================
# INITIALIZE TMUX PLUGIN MANAGER
# ============================================================================
run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# MOUSE WHEEL SCROLLING FIX (MUST BE AFTER TPM)
# ============================================================================
# This makes mouse scrolling work consistently in all panes
# Put AFTER TPM to override any plugin settings
# - Automatically enters copy mode on scroll up
# - Exits copy mode when scrolling to bottom
# - Works in shell prompts, vim, less, etc.

# Mouse wheel up - FORCE copy mode always (no conditions)
# This completely overrides any program's attempt to handle mouse events
bind -n WheelUpPane select-pane \; copy-mode -e \; send-keys -M

# Mouse wheel down - scroll down or exit copy mode at bottom  
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Exit copy mode with Escape or q (in addition to existing bindings)
bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi q send-keys -X cancel